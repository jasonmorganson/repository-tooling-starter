# Root sentinel for mise monorepo task discovery. Repository tooling lives in
# .config/mise/config.toml so application runtimes can be added independently.
monorepo_root = true

[task_config]
includes = [
  "git::https://github.com/jasonmorganson/repository-tooling.git//tasks?ref=main",
  "mise-tasks",
  ".mise-tasks",
  "mise/tasks",
  ".mise/tasks",
  ".config/mise/tasks",
]
